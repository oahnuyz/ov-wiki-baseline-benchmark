bridge:
  base_url: "http://127.0.0.1:19828"
  token_env: "LLM_WIKI_API_TOKEN"

model:
  name: "doubao-seed-2-0-lite-260428"
  provider: "volcengine"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  api_key_env: "ARK_API_KEY"
  temperature: 0
  thinking: "disabled"

embedding:
  name: "doubao-embedding-vision-251215"
  provider: "volcengine"
  base_url: "https://ark.cn-beijing.volces.com/api/v3"
  dimensions: 1024
  input: "multimodal"

execution:
  mode: "standard"
  retrieval_mode: "standard"
  top_k: "official_default"
  max_context_size: "official_default"
  project_template: "general"
  output_language: "English"
  chunking: "official_default"
  persist_extracted_markdown: false
  vector_retrieval: true
  pdf_parser: "builtin"
  image_captioning: true
  review_sweep_in_ingest: true
  qa_workers: 1
  judge_workers: 1
  ingest_batch_size: 25
  max_batch_retries: 2
  restart_between_ingest_batches: true
  service_restart_command:
    - "/home/ZhangYunhao/nashsu-llm-wiki-baseline/tools/restart-llm-wiki-headless.sh"
  service_stop_command:
    - "/home/ZhangYunhao/nashsu-llm-wiki-baseline/tools/stop-llm-wiki-headless.sh"
  startup_timeout_seconds: 300
  qa_timeout_seconds: 600
  qa_max_agent_iterations: 20
  qa_max_retrieval_actions: 15
  max_qa_retries: 2
  request_timeout_seconds: 129600

paths:
  output_dir: "~/nashsu-llm-wiki-baseline/results"
  project_path: "~/nashsu-llm-wiki-baseline/project"
  snapshot_root: "~/nashsu-llm-wiki-baseline/snapshots"
